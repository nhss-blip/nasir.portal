{% extends 'base.html' %}
{% from 'macros.html' import csrf with context %}
{% block content %}<div class="account-width"><div class="page-heading"><p class="eyebrow">School publishing</p><h1>Staff sign-in</h1><p class="muted">Sign in to publish announcements and magazine issues.</p></div>
<form class="panel form-stack" method="post">{{ csrf() }}
{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
<div><label for="username">Username</label><input id="username" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
<div><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required></div>
<button>Sign in</button></form></div>{% endblock %}

{% extends 'admin/base.html' %}
{% from 'macros.html' import csrf with context %}
{% block workspace %}<section class="panel account-width"><h2>Change my password</h2><p class="muted">Changing your password signs out your other sessions. This session stays signed in.</p><form class="form-stack" method="post" action="{{ url_for('staff.password') }}">{{ csrf() }}
<div><label for="current-password">Current password</label><input id="current-password" type="password" name="old" autocomplete="current-password" required></div>
<div><label for="new-password">New password</label><input id="new-password" type="password" name="new" autocomplete="new-password" minlength="8" required aria-describedby="password-help"><p class="field-help" id="password-help">Use at least 8 characters.</p></div><button>Change password</button></form></section>{% endblock %}
